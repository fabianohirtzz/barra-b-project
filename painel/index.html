<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Barra Boat</title>

  <link rel="icon" href="../assets/img/marca/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="painel.css?v=9">
</head>
<body>

    <symbol id="p-agenda" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></g></symbol>
    <symbol id="p-clientes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M15.5 5.2a3.3 3.3 0 0 1 0 6.6M17.5 14.8c2.3.6 3.6 2.4 4 5.2"/></g></symbol>
    <symbol id="p-dinheiro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12.5" rx="2.5"/><circle cx="12" cy="12.25" r="2.8"/><path d="M6 9.5v.01M18 15v.01"/></g></symbol>
    <symbol id="p-mais" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="p-lancha" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 14.5h17.8l-2.4 4H5.4Z"/><path d="M6 14.5 8 10h7.5l2.8 4.5"/><path d="M10 10V7.5h4"/></g></symbol>
    <symbol id="p-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2A9.7 9.7 0 0 0 3.6 16.8L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2Zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.4 1 2.5.1.2 1.7 2.7 4.2 3.8 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.2Z"/></symbol>
    <symbol id="p-mais-um" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="p-seta" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></symbol>
    <symbol id="p-volta" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></symbol>
    <symbol id="p-fechar" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>

    <symbol id="p-ok" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="p-relogio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="p-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g></symbol>
    <symbol id="p-foto" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="14" rx="2.5"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5.5 10 3.5h4l1.5 2"/></g></symbol>

    <symbol id="p-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13l10.5-6.5Z"/></symbol>
  </svg>

  <main class="entrada" id="entrada" hidden>
    <form class="entrada__caixa" id="entrada-form">
      <img src="../assets/img/marca/logo-branco.png" alt="Barra Boat Floripa" width="190">
      <h1>Painel</h1>
      <label class="campo"><span>E-mail</span><input type="email" id="entrada-email" autocomplete="username" required></label>
      <label class="campo"><span>Senha</span><input type="password" id="entrada-senha" autocomplete="current-password" required></label>
      <p class="erro" id="entrada-erro" role="alert" hidden></p>
      <button class="botao botao--principal botao--cheio" type="submit" id="entrada-botao">Entrar</button>
      <p class="entrada__ajuda">Esqueceu a senha? Fale com a Freela In Home pelo WhatsApp.</p>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <nav class="nav" aria-label="Menu do painel">
      <div class="nav__marca"><img src="../assets/img/marca/logo-branco.png" alt="Barra Boat Floripa"></div>
      <a class="nav__item" href="#hoje" data-nav="hoje"><svg><use href="#p-hoje"/></svg><span>Hoje</span></a>
      <a class="nav__item" href="#agenda" data-nav="agenda"><svg><use href="#p-agenda"/></svg><span>Agenda</span></a>
      <a class="nav__item" href="#clientes" data-nav="clientes"><svg><use href="#p-clientes"/></svg><span>Clientes</span></a>
      <a class="nav__item" href="#dinheiro" data-nav="dinheiro"><svg><use href="#p-dinheiro"/></svg><span>Dinheiro</span></a>
      <a class="nav__item" href="#mais" data-nav="mais"><svg><use href="#p-mais"/></svg><span>Mais</span></a>
      <button class="nav__sair" type="button" data-sair>Sair</button>
    </nav>
    <main class="tela" id="tela" tabindex="-1"></main>
  </div>

  <div class="gaveta" id="gaveta" hidden>
    <div class="gaveta__fundo" data-fechar></div>
    <section class="gaveta__caixa" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo">
      <header class="gaveta__topo">
        <h2 id="gaveta-titulo"></h2>
        <button class="botao-icone" type="button" data-fechar aria-label="Fechar"><svg><use href="#p-fechar"/></svg></button>
      </header>
      <div class="gaveta__corpo" id="gaveta-corpo"></div>
    </section>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=6" defer></script>
</body>
</html>
